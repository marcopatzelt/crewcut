[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crewcut"
version = "0.1.0"
description = "A crew of AI agents that makes a whole YouTube video, from idea to upload."
readme = "README.md"
license = "MIT"
authors = [{ name = "Marco Patzelt" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "numpy>=1.26",
  "qrcode>=7.4",
  "python-multipart>=0.0.9",
  "click>=8",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1"]
youtube = ["google-api-python-client>=2.120", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2", "yt-dlp>=2025.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
crewcut = "crewcut.cli:main"

[project.urls]
Homepage = "https://github.com/marcopatzelt/crewcut"

[tool.setuptools.packages.find]
include = ["crewcut*"]

[tool.setuptools.package-data]
crewcut = ["compute/setup.sh"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
