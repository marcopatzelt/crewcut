<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- A hand-drawn backdrop for the app window: a mint sky and rolling green hills in Crewcut's colours. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7EBDB"/>
      <stop offset="0.55" stop-color="#E4F8F1"/>
      <stop offset="1" stop-color="#F7FDFB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.26" r="0.42">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9E4D1"/>
      <stop offset="1" stop-color="#C9EFE2"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ACBAE"/>
      <stop offset="1" stop-color="#4DB896"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA285"/>
      <stop offset="1" stop-color="#1B8469"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#127A63"/>
      <stop offset="1" stop-color="#0B5A4B"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <path d="M0 560 C 180 500 360 470 560 500 C 760 530 900 450 1100 440 C 1300 430 1460 480 1600 470 L1600 1000 L0 1000 Z" fill="url(#far)"/>
  <path d="M0 650 C 220 590 420 600 640 640 C 860 680 1040 600 1240 590 C 1400 582 1520 610 1600 620 L1600 1000 L0 1000 Z" fill="url(#mid)"/>
  <path d="M0 760 C 260 700 520 720 760 770 C 980 815 1180 740 1380 730 C 1480 725 1560 735 1600 745 L1600 1000 L0 1000 Z" fill="url(#near)"/>
  <path d="M0 870 C 300 820 600 840 860 880 C 1120 920 1360 860 1600 850 L1600 1000 L0 1000 Z" fill="url(#front)"/>
</svg>
