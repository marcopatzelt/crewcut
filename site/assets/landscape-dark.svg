<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- The same hills at dusk: a deep teal sky with a mint glow, for dark mode. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071A17"/>
      <stop offset="0.6" stop-color="#0E2E28"/>
      <stop offset="1" stop-color="#15413A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#5FE3C3" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#34C3A4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34C3A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5C4E"/>
      <stop offset="1" stop-color="#18493F"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174A3F"/>
      <stop offset="1" stop-color="#113A31"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3A31"/>
      <stop offset="1" stop-color="#0B2D26"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2A23"/>
      <stop offset="1" stop-color="#061C18"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <path d="M0 560 C 180 500 360 470 560 500 C 760 530 900 450 1100 440 C 1300 430 1460 480 1600 470 L1600 1000 L0 1000 Z" fill="url(#far)"/>
  <path d="M0 650 C 220 590 420 600 640 640 C 860 680 1040 600 1240 590 C 1400 582 1520 610 1600 620 L1600 1000 L0 1000 Z" fill="url(#mid)"/>
  <path d="M0 760 C 260 700 520 720 760 770 C 980 815 1180 740 1380 730 C 1480 725 1560 735 1600 745 L1600 1000 L0 1000 Z" fill="url(#near)"/>
  <path d="M0 870 C 300 820 600 840 860 880 C 1120 920 1360 860 1600 850 L1600 1000 L0 1000 Z" fill="url(#front)"/>
</svg>
