# The desktop app's addition to the repository's compose.yaml (which it ships unchanged): no build from source and no
# pull by Compose; the app pulls the image itself, with progress, the tag matching the app's version.
services:
  crewcut:
    build: !reset null
    pull_policy: never
    env_file: !reset []
    environment:
      # the host helper's key (./start.sh's .env has it too): the app keeps it in its data folder (stack/.env) and
      # passes it in the docker command's environment
      CREWCUT_HOST_TOKEN: ${CREWCUT_HOST_TOKEN:-}
