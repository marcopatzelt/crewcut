# Packages the desktop app. CI builds it (.github/workflows/desktop.yml), never a laptop. No release is published from
# here: `--publish never`; the GitHub release (and with it the updates) is made by the owner.
appId: dev.crewcut.desktop
productName: Crewcut
copyright: Copyright 2026 Marco Patzelt (MIT)
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!dist/test/**"
extraResources:
  # the repository's own compose.yaml, unchanged: the app runs the same stack as ./start.sh
  - from: ../compose.yaml
    to: stack/compose.yaml
  - from: stack/desktop.yaml
    to: stack/desktop.yaml
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  # Without a Developer ID (CSC_LINK), CI passes -c.mac.identity=- : an ad-hoc signature, which Apple silicon needs to
  # start the app at all. Notarizing is switched on in CI only when the APPLE_* secrets exist.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
linux:
  executableName: crewcut
  icon: build/icon.png
  category: AudioVideo
  target: [AppImage, deb]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  maintainer: Marco Patzelt
  synopsis: A crew of AI agents that makes a whole YouTube video
publish:
  - provider: github
    owner: marcopatzelt
    repo: crewcut
