<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--CC:HEAD-->
    <style>
      #root .kw { position: absolute; display: flex; flex-direction: column; }
      #root .kw-row { display: block; white-space: nowrap; }
      #root .kw-main { line-height: 1.0; letter-spacing: -0.015em; }
      #root .kw-number { line-height: 0.92; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      #root .kw-unit { letter-spacing: -0.01em; }
      #root .kw-sub { line-height: 1.12; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="2.5">
      <div id="kw-clip" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <div id="kw-wrap" class="cc-layer">
          <div id="kw" class="kw"></div>
        </div>
      </div>
    </div>
    <script>
      CC.start("main", function (tl) {
        var P = CC.data, pal = CC.palette, u = CC.u;
        var clip = document.getElementById("kw-clip"), wrap = document.getElementById("kw-wrap"), box = document.getElementById("kw");
        var ground = P.ground === "ink" ? pal.ink : pal.paper;
        CC.ground(clip, ground);
        var col = CC.colors(P.ground);
        var side = CC.side(P.side);
        var maxW = Math.max(240 * u, side.box.w - 24 * u);
        var words = (P.words instanceof Array ? P.words : String(P.words || "").split(/\s+/)).filter(function (w) { return String(w).trim(); }).slice(0, 4);
        var isNumber = P.number !== null && P.number !== undefined && String(P.number).trim() !== "";
        var portrait = CC.portrait;
        // sizes from the spec sheet: keyword 120 to 168 px (Short 110 to 140), number 150 to 210 px, side line 64 to 80
        var top = isNumber ? (portrait ? 180 : 210) : (portrait ? 140 : 168), floor = isNumber ? (portrait ? 130 : 150) : (portrait ? 110 : 120);
        var want = Math.round((P.size || top) * u);
        var rows = [];

        var sub = null;
        if (P.sub) {                                  // the side line comes first: the keyword is the last to arrive
          sub = CC.el("div", "kw-row kw-sub cc-body", String(P.sub), box);
          sub.style.color = col.side;
          rows.push(sub);
        }
        var main;
        if (isNumber) {
          main = CC.el("div", "kw-row kw-number cc-display", null, box);
          var digits = CC.el("span", "kw-digits", String(P.number), main);
          if (P.unit) { var un = CC.el("span", "kw-unit cc-display", " " + String(P.unit), main); un.style.fontSize = "0.42em"; }
          main.style.color = col.main;
          main._digits = digits;
        } else {
          main = CC.el("div", "kw-row kw-main cc-display", words.join(" "), box);
          main.style.color = col.main;
        }
        if (sub) box.appendChild(sub);                // the side line sits under the keyword, but enters first
        rows.push(main);
        // the keyword in one line, set smaller when the free side is narrow (never under the floor); one word per
        // line only when even the floor does not fit
        var s = CC.fit(main, maxW, want, Math.max(CC.minText, Math.round(floor * u * 0.72)));
        if (!isNumber && main.scrollWidth > maxW && words.length > 1) {
          main.textContent = "";
          words.forEach(function (w, i) { CC.el("span", "kw-word", w + (i < words.length - 1 ? "\n" : ""), main); });
          main.style.whiteSpace = "pre";
          s = CC.fit(main, maxW, want, Math.max(CC.minText, Math.round(floor * u * 0.72)));
        }
        if (sub) sub.style.fontSize = Math.max(CC.minText, Math.min(Math.round(80 * u), Math.round(s * 0.48))) + "px";
        if (sub) { sub.style.marginTop = Math.round(s * 0.08) + "px"; CC.fit(sub, maxW, parseInt(sub.style.fontSize, 10), CC.minText); }

        // place: right-aligned at the safe edge on the right, left-aligned on the left; the block centred on the
        // spoken height (the baseline at about half the frame, head to shoulder)
        var right = side.side === "right";
        box.style.alignItems = right ? "flex-end" : (side.side === "below" ? "center" : "flex-start");
        var bw = box.offsetWidth, bh = box.offsetHeight;
        var x = right ? CC.safe.x + CC.safe.w - bw : (side.side === "below" ? CC.safe.x + (CC.safe.w - bw) / 2 : CC.safe.x);
        var yMid = P.y !== null && P.y !== undefined ? P.y * CC.H : (side.side === "below" ? side.box.y + side.box.h * 0.4 : 0.47 * CC.H);
        var y = Math.max(CC.safe.y, Math.min(CC.safe.y + CC.safe.h - bh, yMid - bh / 2));
        box.style.left = Math.round(x) + "px";
        box.style.top = Math.round(y) + "px";

        // over video: halo, side scrim and a soft shadow (type stays readable over a bright set)
        var halo = null;
        if (col.video) {
          rows.forEach(function (r) { r.style.textShadow = CC.shadow(); });
          CC.scrim(clip, side.side);
          halo = CC.halo(box, wrap);
        }
        var twins = halo ? Array.prototype.slice.call(halo.querySelectorAll(".kw-row")) : [];
        var order = Array.prototype.slice.call(box.querySelectorAll(".kw-row"));

        // time: the push from the speaker's side, 2 frames apart, the keyword complete 1 frame before its word
        var land = CC.cue("land", null), n = rows.length, st = CC.stagger;
        var tIn = land === null ? (P.inAt || 0) : Math.max(0, CC.landBy(land) - CC.enter - st * (n - 1));
        var tOut = P.outAt !== null && P.outAt !== undefined ? P.outAt : CC.outAt(st * (n - 1));
        var scrim = clip.querySelector(".cc-scrim");
        if (scrim) {
          tl.fromTo(scrim, { opacity: 0 }, { opacity: 1, duration: CC.enter, ease: CC.easeIn }, tIn);
          tl.to(scrim, { opacity: 0, duration: CC.exit, ease: CC.easeOut }, tOut + st * (n - 1));
        }
        rows.forEach(function (r, i) {
          var t = [r];
          var k = order.indexOf(r);
          if (twins[k]) t.push(twins[k]);
          CC.pushIn(tl, t, tIn + st * i, side.from);
          CC.pushOut(tl, t, tOut + st * (n - 1 - i), side.from);
        });
        // a number counts up and is complete 1 frame before its word (separators stand still)
        if (isNumber) {
          var target = String(P.number), m = target.replace(/[^0-9]/g, "");
          if (m && m.length <= 9) {
            var value = parseInt(m, 10), from = { v: 0 };
            var stop = Math.max(tIn + CC.enter, land === null ? tIn + CC.enter + 0.4 : CC.landBy(land));
            var fmt = function (v) {
              var str = String(Math.round(v)), out = "", k = str.length - 1;
              for (var c = target.length - 1; c >= 0; c--) {
                if (/[0-9]/.test(target[c])) { out = (k >= 0 ? str[k] : "0") + out; k--; } else out = target[c] + out;
              }
              return out;
            };
            var digitsEls = [main._digits];
            if (halo) { var hd = halo.querySelector(".kw-digits"); if (hd) digitsEls.push(hd); }
            var show = function (txt) { digitsEls.forEach(function (d) { d.textContent = txt; }); };
            show(fmt(0));
            tl.to(from, { v: value, duration: Math.max(0.3, stop - tIn), ease: CC.easeIn, onUpdate: function () { show(fmt(from.v)); } }, tIn);
            tl.call(function () { show(target); }, null, stop);
          }
        }
        CC.hold(tl, box, right ? "100% 50%" : "0% 50%");
      });
    </script>
  </body>
</html>
