<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>clip-card</title>
<link rel="stylesheet" href="base.css">
<script src="motion.js"></script>
<script src="scene.js"></script>
</head><body><div id="stage"></div>
<script>
// Scene "clip-card": a clip runs as a card on the stage, with a visible source label, so it is clear the footage is not
// ours. The clip comes as single frames (folder + pattern "%04d.jpg" at the episode fps, start = first frame).
// No zoom inside the clip. Data keys: BLOCKS.md
const EXAMPLE={format:'landscape',frames:70,folder:'',pattern:'%04d.jpg',start:0,aspect:16/9,chip:'The demo',label:'Source: example'};
SCENE(EXAMPLE,S=>{const{M,D,W,H}=S;
const F=S.fine({width:S.portrait?0.86:0.62,enter:20,chip_size:44,label_size:40,drift:M.DRIFT});
const decor=S.decor({avoid:[[W*0.12,H*0.08,W*0.88,H*0.92]]});
const E=S.layer(W/2,H/2),kw=W*F.width,kh=kw/(Number(D.aspect)||16/9),y0=H/2+(S.landscape?8:0);
const r=M.at(M.el('div','frame',E),W/2,y0);r.style.width=(kw+24)+'px';
const inner=M.el('div','frame-inner',r),box=M.el('div','frame-img',inner,D.folder?'<img alt="">':'<div class="frame-empty">clip</div>');box.style.height=kh+'px';
const img=box.querySelector('img');
const chip=D.chip?M.at(M.chip(E,D.chip),W/2,y0-kh/2-12-F.chip_size*1.6):null;
if(chip)S.chipFit(chip,{height:Math.round(F.chip_size*2.1),size:F.chip_size,pad:Math.round(F.chip_size*0.8)},kw);
const label=D.label?M.at(M.chip(E,D.label,'paper'),W/2,y0+kh/2+12+F.label_size*1.3):null;
if(label)S.chipFit(label,{height:Math.round(F.label_size*2.1),size:F.label_size,pad:Math.round(F.label_size*0.8)},kw);
const frameFile=n=>(D.folder||'')+'/'+String(D.pattern||'%04d.jpg').replace('%04d',String(Math.max(0,n)).padStart(4,'0'));
let pending=Promise.resolve();
S.start(f=>{
  decor.update(f);M.scaleLayer(E,M.drift(Math.max(0,f-M.ENTER),F.drift));
  const p=M.ease(M.prog(f,-6,F.enter)),o=M.prog(f,-6,5);M.set(r,{s:0.93+0.07*p,o,y:(1-p)*20});
  inner.style.transform=`rotateY(${((1-p)*-16).toFixed(3)}deg)`;
  if(chip){const a=M.enter(f,-2);M.set(chip,{s:a.s,o:a.o,y:(1-a.o)*12});}
  if(label){const a=M.enter(f,2);M.set(label,{s:a.s,o:a.o,y:(1-a.o)*12});}
  if(D.folder&&img){img.src=frameFile((D.start||0)+f);pending=img.decode().catch(()=>{});}   // the clip runs from its first frame
});
const plain=window.setFrame;window.setFrame=async n=>{plain(n);await pending;return true;};   // the renderer waits for the clip frame
});
</script></body></html>
