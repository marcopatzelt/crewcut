name: screens

# Renders screenshots on GitHub's runner, never on a developer laptop:
# the static mockup now, the built web app in demo mode once web/ exists.
on:
  push:
    branches: [main]
    paths: ["docs/mockup.html", "web/**", ".github/workflows/screens.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.50.1 install --with-deps chromium
      - name: Mockup, light and dark
        run: |
          mkdir -p shots
          npx -y playwright@1.50.1 screenshot --viewport-size "1440, 900" --wait-for-timeout 2000 "file://$PWD/docs/mockup.html" shots/mockup.png
          npx -y playwright@1.50.1 screenshot --viewport-size "1440, 900" --color-scheme dark --wait-for-timeout 2000 "file://$PWD/docs/mockup.html" shots/mockup-dark.png
      - name: Build the web UI
        if: hashFiles('web/package-lock.json') != ''
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Web UI in demo mode, light, dark and phone width
        if: hashFiles('web/package-lock.json') != ''
        run: |
          (cd web/dist && python3 -m http.server 8099 > /dev/null 2>&1 &)
          sleep 2
          P="npx -y playwright@1.50.1 screenshot --wait-for-timeout 2500"
          $P --viewport-size "1440, 900" "http://localhost:8099/index.html?demo=1" shots/app.png
          $P --viewport-size "1440, 900" --color-scheme dark "http://localhost:8099/index.html?demo=1" shots/app-dark.png
          $P --viewport-size "390, 844" "http://localhost:8099/index.html?demo=1" shots/app-phone.png
          $P --viewport-size "390, 844" "http://localhost:8099/prompter.html?demo=1" shots/prompter-phone.png
          $P --viewport-size "1440, 900" "http://localhost:8099/index.html?demo=1#/profile" shots/app-profile.png
          $P --viewport-size "1440, 900" "http://localhost:8099/index.html?demo=1#/crew" shots/app-crew.png
          $P --viewport-size "1280, 800" "http://localhost:8099/index.html?demo=1" shots/app-1280.png
          $P --viewport-size "1100, 800" "http://localhost:8099/index.html?demo=1" shots/app-1100.png
          $P --viewport-size "900, 800" "http://localhost:8099/index.html?demo=1" shots/app-900.png
      - name: README images (window, 2x density, light and dark) and the animation
        if: hashFiles('web/package-lock.json') != ''
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p /tmp/shots-tool && cd /tmp/shots-tool && npm init -y > /dev/null && npm i -s playwright@1.50.1
          cp "$GITHUB_WORKSPACE/tools/ci/readme_shots.mjs" /tmp/shots-tool/
          node /tmp/shots-tool/readme_shots.mjs http://localhost:8099 "$GITHUB_WORKSPACE/shots/readme"
          rm -rf "$GITHUB_WORKSPACE/shots/readme/video-tmp"
          ls -la "$GITHUB_WORKSPACE/shots/readme"
      - name: Taste gate (design check of the built app, report)
        if: hashFiles('web/package-lock.json') != ''
        continue-on-error: true
        run: |
          git clone -q https://github.com/Leonxlnx/taste-skill.git /tmp/taste && git -C /tmp/taste checkout -q f6b76575f949707b4e3c37cd86cb44b0b98643e8
          export CHROME_PATH=$(cd /tmp/shots-tool && node -e "console.log(require('playwright').chromium.executablePath())")
          mkdir -p shots/taste
          node /tmp/taste/skills/taste-skill/scripts/consistency.mjs "http://localhost:8099/index.html?demo=1" \
            --page software --widths 1440,1100,390 --profile /tmp/taste-profile --out shots/taste --no-sweep \
            | tee shots/taste/report.txt
          python3 tools/ci/taste_waivers.py shots/taste/report.txt .taste-skill/waivers.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            shots/*.png
            shots/readme/
            shots/taste/
