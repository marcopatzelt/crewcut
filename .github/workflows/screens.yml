name: screens

# Renders screenshots on GitHub's runner, never on a developer laptop: the static mockup, the built web app with
# sample data (tools/ci/sample_server.mjs answers /api from tests/web-sample; the app itself ships none), the README
# images and the brand PNGs. They are uploaded as the artifact "screens" at once.
# The Taste gate runs after the upload and only for big changes (tools/ci/gate_decide.sh: more than 300 changed lines
# in web/, a design token in web/src/styles/tokens.css changed, a file added or removed, "[gate]" in a commit
# message, or run_gate on a manual run). It is information only: findings go to the job summary, it never fails the
# run and nothing waits for it (owner's rule, 17 Nov 2026).
on:
  push:
    branches: [main]
    paths: ["docs/mockup.html", "docs/brand/**", "web/**", "tests/web-sample/**", "tools/ci/**", ".github/workflows/screens.yml"]
  workflow_dispatch:
    inputs:
      run_gate:
        description: "Also run the Taste gate (information only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.50.1 install --with-deps chromium
      - name: Mockup, light and dark
        run: |
          mkdir -p shots
          npx -y playwright@1.50.1 screenshot --viewport-size "1440, 900" --wait-for-timeout 2000 "file://$PWD/docs/mockup.html" shots/mockup.png
          npx -y playwright@1.50.1 screenshot --viewport-size "1440, 900" --color-scheme dark --wait-for-timeout 2000 "file://$PWD/docs/mockup.html" shots/mockup-dark.png
      - name: Build the web UI
        if: hashFiles('web/package-lock.json') != ''
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: The CI picture server (the built app, /api answered from the sample data in tests/web-sample)
        if: hashFiles('web/package-lock.json') != ''
        run: |
          web/node_modules/.bin/esbuild tests/web-sample/backend.ts --bundle --platform=node --format=esm \
            --outfile=/tmp/sample-backend.mjs --log-level=warning
          nohup node tools/ci/sample_server.mjs /tmp/sample-backend.mjs web/dist tests/web-sample/public 8099 \
            > /tmp/sample-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8099/api/state && break; sleep 1; done
          curl -fs http://localhost:8099/api/state > /dev/null
      - name: Web UI with sample data, light, dark and phone width; the states without a server
        if: hashFiles('web/package-lock.json') != ''
        run: |
          P="npx -y playwright@1.50.1 screenshot --wait-for-timeout 2500"
          U="http://localhost:8099/index.html"
          E="#/e/012-website-100-times"
          $P --viewport-size "1440, 900" "$U" shots/app.png
          $P --viewport-size "1440, 900" --color-scheme dark "$U" shots/app-dark.png
          $P --viewport-size "1440, 900" "$U$E" shots/app-episode.png
          $P --viewport-size "1440, 900" --color-scheme dark "$U$E" shots/app-episode-dark.png
          $P --viewport-size "1100, 800" --color-scheme dark "$U$E" shots/app-episode-1100.png
          $P --viewport-size "390, 844" "$U" shots/app-phone.png
          $P --viewport-size "390, 844" --color-scheme dark "$U$E" shots/app-episode-phone.png
          $P --viewport-size "390, 844" "http://localhost:8099/p/sample-token" shots/prompter-phone.png
          $P --viewport-size "1440, 900" "$U#/profile" shots/app-profile.png
          $P --viewport-size "1440, 900" "$U#/crew" shots/app-crew.png
          $P --viewport-size "1280, 800" "$U" shots/app-1280.png
          $P --viewport-size "1100, 800" "$U" shots/app-1100.png
          $P --viewport-size "900, 800" "$U" shots/app-900.png
          # No Crewcut behind the page: a plain static server, so /api answers 404 pages. "Crewcut is starting…"
          (cd web/dist && python3 -m http.server 8098 > /dev/null 2>&1 &)
          sleep 1
          $P --viewport-size "1440, 900" "http://localhost:8098/index.html" shots/app-starting.png
          $P --viewport-size "1440, 900" --color-scheme dark "http://localhost:8098/index.html" shots/app-starting-dark.png
      - name: README images (the app with sample data, 2x density, light and dark) and the animation
        if: hashFiles('web/package-lock.json') != ''
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p /tmp/shots-tool && cd /tmp/shots-tool && npm init -y > /dev/null && npm i -s playwright@1.50.1
          cp "$GITHUB_WORKSPACE/tools/ci/readme_shots.mjs" /tmp/shots-tool/
          node /tmp/shots-tool/readme_shots.mjs http://localhost:8099 "$GITHUB_WORKSPACE/shots/readme"
          rm -rf "$GITHUB_WORKSPACE/shots/readme/video-tmp"
          ls -la "$GITHUB_WORKSPACE/shots/readme"
      - name: Brand PNGs (icons 16 to 1024, social preview, crew) from the SVGs in docs/brand
        if: hashFiles('web/package-lock.json') != ''
        run: |
          cp "$GITHUB_WORKSPACE/tools/ci/brand_png.mjs" /tmp/shots-tool/
          node /tmp/shots-tool/brand_png.mjs "$GITHUB_WORKSPACE/docs/brand" "$GITHUB_WORKSPACE/shots/brand"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            shots/*.png
            shots/readme/
            shots/brand/
      - name: Big change? (the Taste gate runs only for big changes)
        id: decide
        env:
          RUN_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gate || 'false' }}
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: sh tools/ci/gate_decide.sh "${{ github.event.before }}" "$GITHUB_SHA" "web" "web/src/styles/tokens.css" "^$" >> "$GITHUB_OUTPUT"
      - name: Taste gate (information only, big changes only; never fails the run)
        if: steps.decide.outputs.gate == 'true' && hashFiles('web/package-lock.json') != ''
        continue-on-error: true
        run: |
          # Ubuntu 24.04 runners restrict user namespaces, which Chrome's sandbox needs (Taste starts its own Chrome)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null
          git clone -q https://github.com/Leonxlnx/taste-skill.git /tmp/taste && git -C /tmp/taste checkout -q f6b76575f949707b4e3c37cd86cb44b0b98643e8
          export CHROME_PATH=$(cd /tmp/shots-tool && node -e "console.log(require('playwright').chromium.executablePath())")
          mkdir -p shots/taste
          node /tmp/taste/skills/taste-skill/scripts/consistency.mjs "http://localhost:8099/index.html" \
            --page software --widths 1440,1100,390 --profile /tmp/taste-profile --out shots/taste --no-sweep \
            | tee shots/taste/report.txt
          echo "Taste gate ran because: ${{ steps.decide.outputs.why }}. Information only." >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/taste_waivers.py shots/taste/report.txt .taste-skill/waivers.json | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.gate == 'true'
        with:
          name: screens-taste
          path: shots/taste/
