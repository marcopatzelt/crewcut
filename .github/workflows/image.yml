name: image

# Builds the Docker image on GitHub's runners (never on a developer laptop):
#   base for linux/amd64 (with smoke tests and renders) and linux/arm64 (native arm64 runner, free for public repos),
#   and the gpu variant for linux/amd64. After the tests pass it pushes to ghcr.io (public packages):
#     every push to main     :edge and :<sha>                       (gpu: :edge-gpu)
#     a version tag v1.2.3   :1.2.3, :latest and :<sha>             (gpu: :1.2.3-gpu, :gpu, :latest-gpu)
#     a manual run, push on  :latest and :<sha>                     (gpu: :gpu, :latest-gpu)
#   The desktop app pulls the image whose tag is its own version; a development build follows :edge.
#   Tags and releases are made by the owner only.
# The motion engine comes in as a finished binary from ghcr.io/<owner>/crewcut-effectcraft (effectcraft.yml builds it);
# every job logs in first because that package can be private.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "site/**", "desktop/**"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images to ghcr.io as :latest"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# A newer push to main replaces a running one; a manual run and a version tag are never cancelled by it.
concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  base-amd64:
    name: base, linux/amd64, smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          platforms: linux/amd64
          load: true
          tags: crewcut:ci
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,mode=max,scope=base-amd64
      - name: doctor
        run: docker run --rm --entrypoint "" -e CREWCUT_STUDIO=/tmp/studio crewcut:ci crewcut doctor --ci
      - name: unit tests inside the image
        run: docker run --rm --entrypoint "" crewcut:ci bash -c "cd /app && /opt/venv/bin/pip install -q pytest && /opt/venv/bin/python -m pytest -q tests"
      - name: entrypoint starts the server as a normal user
        run: |
          mkdir -p studio-ci && docker run -d --name cc -p 127.0.0.1:4747:4747 -e CREWCUT_INSTALL_ENGINE=0 -v "$PWD/studio-ci:/studio" crewcut:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4747/api/health && break; sleep 2; done
          curl -fsS http://localhost:4747/api/state | head -c 400; echo
          docker exec cc ps -o user=,args= | grep "crewcut serve"
          docker logs cc; docker rm -f cc
      - name: the studio folder decides who runs Crewcut (another uid, a folder Docker makes, a read-only folder)
        run: |
          up() {  # up <name> <port> <studio>: start and wait for the server
            docker run -d --name "$1" -p "127.0.0.1:$2:4747" -e CREWCUT_INSTALL_ENGINE=0 -e CREWCUT_INSTALL_SKILLS=0 \
              -v "$3:/studio" crewcut:ci > /dev/null
            for i in $(seq 1 45); do curl -fsS "http://localhost:$2/api/health" > /dev/null 2>&1 && return 0; sleep 2; done
            docker logs "$1"; return 1
          }
          serve_uid() { docker exec "$1" ps -o uid=,args= | awk '/crewcut serve/ { print $1; exit }'; }
          # a folder owned by another user (4321): Crewcut runs as 4321 and the crew's files are 4321's
          mkdir -p s-other && sudo chown 4321:4321 s-other && sudo chmod 755 s-other
          up u1 4750 "$PWD/s-other"
          test "$(serve_uid u1)" = 4321 && test "$(stat -c %u s-other/.claude)" = 4321
          docker rm -f u1 > /dev/null
          # a folder that is not there yet: Docker makes it as root, Crewcut runs as the image's user 1000
          up u2 4751 "$PWD/s-new"
          test "$(serve_uid u2)" = 1000 && test "$(stat -c %u s-new/.claude)" = 1000
          docker rm -f u2 > /dev/null
          # a read-only folder: the container stops with one line that says why
          mkdir -p s-ro
          code=0; docker run --name u3 -e CREWCUT_INSTALL_ENGINE=0 -v "$PWD/s-ro:/studio:ro" crewcut:ci true || code=$?
          test "$code" = 78 && docker logs u3 2>&1 | grep -q "cannot write the studio folder"
          docker rm -f u3 > /dev/null
          echo "the studio folder's owner runs Crewcut"
      - name: render every 2D scene, a 3D still on the CPU, and the 10-second preview
        run: |
          mkdir -p ci-out && chmod 777 ci-out
          docker run --rm --shm-size=1g --entrypoint "" -v "$PWD/ci-out:/out" crewcut:ci bash /app/tests/smoke/render.sh /out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-amd64
          path: ci-out/
          if-no-files-found: warn

  rootless:
    name: base, linux/amd64, under rootless Docker (your user is root in the container)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / /mnt
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          platforms: linux/amd64
          load: true
          tags: crewcut:ci
          cache-from: type=gha,scope=base-amd64
      - name: Rootless Docker 29.9.2 (as on Linux desktops that use it), next to the runner's own Docker
        run: |
          sudo apt-get install -y -qq uidmap slirp4netns > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null
          me=$(whoami)
          grep -q "^$me:" /etc/subuid || echo "$me:200000:65536" | sudo tee -a /etc/subuid > /dev/null
          grep -q "^$me:" /etc/subgid || echo "$me:200000:65536" | sudo tee -a /etc/subgid > /dev/null
          mkdir -p /tmp/rootless && cd /tmp/rootless
          for t in docker docker-rootless-extras; do
            curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/$t-29.9.2.tgz" | tar xz
          done
          echo "/tmp/rootless/docker" >> "$GITHUB_PATH"
          echo "/tmp/rootless/docker-rootless-extras" >> "$GITHUB_PATH"
          rt="/tmp/xdg-$(id -u)"; mkdir -p -m 700 "$rt"
          echo "XDG_RUNTIME_DIR=$rt" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/rootless-docker && sudo chown "$me" /mnt/rootless-docker
          PATH=/tmp/rootless/docker:/tmp/rootless/docker-rootless-extras:$PATH XDG_RUNTIME_DIR="$rt" \
            nohup dockerd-rootless.sh --data-root /mnt/rootless-docker > /tmp/rootless.log 2>&1 &
          for i in $(seq 1 60); do
            DOCKER_HOST="unix://$rt/docker.sock" /tmp/rootless/docker/docker info > /dev/null 2>&1 && break; sleep 2
          done
          DOCKER_HOST="unix://$rt/docker.sock" /tmp/rootless/docker/docker info --format '{{.SecurityOptions}}' | tee /dev/stderr | grep -q rootless \
            || { tail -40 /tmp/rootless.log; exit 1; }
          docker save crewcut:ci | DOCKER_HOST="unix://$rt/docker.sock" /tmp/rootless/docker/docker load
      - name: Crewcut under rootless Docker runs as you, and every file it writes in the studio is yours
        run: |
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          mkdir -p s-rootless && chmod 775 s-rootless        # yours on the host, as ~/Crewcut is
          docker run -d --name r1 -p 127.0.0.1:4752:4747 -e CREWCUT_INSTALL_ENGINE=0 -e CREWCUT_INSTALL_SKILLS=0 \
            -v "$PWD/s-rootless:/studio" crewcut:ci
          ok=""; for i in $(seq 1 60); do curl -fsS http://localhost:4752/api/health && { ok=1; break; }; sleep 2; done
          docker logs r1 2>&1 | tail -20
          [ -n "$ok" ]
          test "$(docker inspect --format '{{.RestartCount}}' r1)" = 0
          test "$(docker exec r1 cat /run/crewcut-user)" = "0:0"
          docker exec r1 sh -c 'for p in /proc/[0-9]*; do tr "\0" " " < $p/cmdline 2>/dev/null | grep -q "crewcut serve" \
            && tr "\0" "\n" < $p/environ | grep -qx IS_SANDBOX=1 && exit 0; done; exit 1'
          for f in .claude .crewcut .crewcut/logs .crewcut/home; do
            test "$(stat -c %u "s-rootless/$f")" = "$(id -u)" || { ls -lan s-rootless s-rootless/.crewcut; exit 1; }
          done
          # an earlier start that gave Crewcut's folders to the image's user (1000, a subuid on the host) is repaired
          docker rm -f r1 > /dev/null
          docker run --rm --entrypoint "" -v "$PWD/s-rootless:/studio" crewcut:ci chown -R 1000:1000 /studio/.crewcut
          test "$(stat -c %u s-rootless/.crewcut)" != "$(id -u)"
          docker run -d --name r2 -p 127.0.0.1:4753:4747 -e CREWCUT_INSTALL_ENGINE=0 -e CREWCUT_INSTALL_SKILLS=0 \
            -v "$PWD/s-rootless:/studio" crewcut:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:4753/api/health > /dev/null 2>&1 && break; sleep 2; done
          test "$(stat -c %u s-rootless/.crewcut/logs)" = "$(id -u)"
          docker rm -f r2 > /dev/null
          echo "rootless: Crewcut runs as you"

  base-arm64:
    name: base, linux/arm64 (native runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          platforms: linux/arm64
          load: true
          tags: crewcut:ci-arm64
          cache-from: type=gha,scope=base-arm64
          cache-to: type=gha,mode=max,scope=base-arm64
      - name: doctor (shows the motion engine)
        run: docker run --rm --entrypoint "" -e CREWCUT_STUDIO=/tmp/studio crewcut:ci-arm64 crewcut doctor --ci
      - name: one 2D frame and one motion frame
        run: |
          mkdir -p ci-out && chmod 777 ci-out
          docker run --rm --shm-size=1g --entrypoint "" \
            -v "$PWD/ci-out:/out" crewcut:ci-arm64 bash /app/tests/smoke/render.sh /out --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-arm64
          path: ci-out/
          if-no-files-found: warn

  gpu-amd64:
    name: gpu, linux/amd64 (build only, the runner has no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: gpu
          platforms: linux/amd64
          load: true
          tags: crewcut:ci-gpu
          cache-from: |
            type=gha,scope=base-amd64
            type=gha,scope=gpu-amd64
          cache-to: type=gha,mode=max,scope=gpu-amd64
      - name: doctor (no GPU here, so the GPU check is a note)
        run: docker run --rm --entrypoint "" -e CREWCUT_STUDIO=/tmp/studio crewcut:ci-gpu crewcut doctor --ci
      - name: CUDA libraries are found
        run: docker run --rm --entrypoint "" crewcut:ci-gpu bash -c "ldconfig -p | grep -E 'libcublas|libcudnn' | head -4"

  push:
    name: push to ghcr.io
    if: github.event_name == 'push' || inputs.push
    needs: [base-amd64, base-arm64, gpu-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags for this run
        id: tags
        run: |
          R="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            echo "base=$R:$V,$R:latest,$R:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "gpu=$R:$V-gpu,$R:gpu,$R:latest-gpu" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "base=$R:edge,$R:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "gpu=$R:edge-gpu" >> "$GITHUB_OUTPUT"
          else
            echo "base=$R:latest,$R:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "gpu=$R:gpu,$R:latest-gpu" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.base }}
          cache-from: |
            type=gha,scope=base-amd64
            type=gha,scope=base-arm64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.gpu }}
          cache-from: |
            type=gha,scope=base-amd64
            type=gha,scope=gpu-amd64
