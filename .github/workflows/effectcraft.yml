name: effectcraft

# Builds the motion engine effectcraft-cli from the pinned upstream commit plus the patches in
# third_party/effectcraft/, natively on amd64 and arm64 (never QEMU, never inside the app image). Each run:
#   1. builds and tests (cargo test of what the patches touch, info, one demo frame),
#   2. starts the binary in debian:bookworm-slim and in the CUDA runtime image of rented machines, with no extra packages,
#   3. uploads effectcraft-cli-linux-<arch>.tar.zst + .sha256 as workflow artifacts,
#   4. pushes ghcr.io/<owner>/crewcut-effectcraft:<sha12>-p<patches> as one multi-arch tag (docker/Dockerfile copies
#      the binary from there),
#   5. on a manual run with release = true: a GitHub release effectcraft-<sha12>-p<patches> with the two archives
#      (rented machines without a local copy fetch from there).
on:
  push:
    paths: ["third_party/effectcraft/**", ".github/workflows/effectcraft.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the two archives as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: effectcraft-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crewcut-effectcraft

jobs:
  build:
    name: effectcraft-cli, linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - name: Tag from PIN and patch count
        id: pin
        run: |
          sha=$(awk '$1=="commit"{print $2}' third_party/effectcraft/PIN)
          n=$(ls third_party/effectcraft/patches/*.patch | wc -l)
          echo "tag=${sha:0:12}-p${n}" >> "$GITHUB_OUTPUT"
          echo "tag ${sha:0:12}-p${n}"
      - uses: docker/setup-buildx-action@v3
      - name: Build and test (binary to out/)
        uses: docker/build-push-action@v6
        with:
          context: third_party/effectcraft
          file: third_party/effectcraft/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          outputs: type=local,dest=out
      - name: The binary starts and renders the demo frame in the app image's base and in the rented machines' image
        run: |
          ls -la out out/licenses; cat out/PIN
          for img in debian:bookworm-slim nvidia/cuda:12.4.1-runtime-ubuntu22.04; do
            echo "== $img"
            docker run --rm -v "$PWD/out:/ec:ro" "$img" sh -c \
              '/ec/effectcraft-cli --empty info --json | head -c 400; echo; /ec/effectcraft-cli --demo render-frame --out /tmp/f.png --max-side 640 --json && test -s /tmp/f.png'
          done
      - name: Pack the binary with its licences
        run: |
          name=effectcraft-cli-linux-${{ matrix.arch }}
          tar -C out -cf - effectcraft-cli licenses PIN | zstd -19 -T0 -q -o "$name.tar.zst"
          sha256sum "$name.tar.zst" > "$name.tar.zst.sha256"
          ls -la "$name".tar.zst*
      - uses: actions/upload-artifact@v4
        with:
          name: effectcraft-cli-linux-${{ matrix.arch }}
          path: effectcraft-cli-linux-${{ matrix.arch }}.tar.zst*
          if-no-files-found: error
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest (same build, from the builder's cache)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: third_party/effectcraft
          file: third_party/effectcraft/build.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        run: |
          mkdir -p digests && d="${{ steps.push.outputs.digest }}" && touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    name: one multi-arch tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the tag
        working-directory: digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:${{ needs.build.outputs.tag }}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ needs.build.outputs.tag }}"

  release:
    name: GitHub release with the two archives (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: effectcraft-cli-linux-*
          path: assets
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: effectcraft-${{ needs.build.outputs.tag }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
              --title "$TAG" --notes "effectcraft-cli built from the pinned upstream commit and the patches in third_party/effectcraft/ (MIT OR Apache-2.0, see licenses/ in each archive)."
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber assets/*
