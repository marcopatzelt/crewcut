name: pages

# The landing page in site/ (owner's rule, 17 Nov 2026: small changes go online at once).
#   deploy   every push to main that touches the page (or the film, brand and README pictures) builds site/ and deploys
#            it to GitHub Pages at once; nothing waits for a check. Only while the repository is public.
#   shots    after the deploy: screenshots of the live page at 1440 and 390 px, light and dark (artifact "live-shots"),
#            so a person or an agent can look at what went online.
#   decide   is this a big change? (tools/ci/gate_decide.sh: more than 300 changed lines in site/, a section added or
#            removed, a design token in site.css changed, "[gate]" in a commit message, or run_gate on a manual run)
#   taste    only for big changes: the Taste skill's finish gate over the built page, screenshots at 1440, 1024, 768
#            and 390 px. Information only: it writes its findings to the job summary and never fails the run or delays
#            the deploy. Do not loop on its findings; fix what is visibly wrong and move on.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/brand/**", "docs/readme/**", "docs/launch/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      run_gate:
        description: "Also run the Taste gate (information only; the deploy never waits for it)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TASTE_COMMIT: f6b76575f949707b4e3c37cd86cb44b0b98643e8
  CATEGORY: "YouTube crew of AI agents"
  PRIMARY: "Get Crewcut on GitHub"

jobs:
  deploy:
    name: Build and deploy the landing page at once
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: |
          sudo apt-get install -y -qq webp > /dev/null
          sh site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4

  shots:
    name: Screenshots of the live page (1440 and 390 px, light and dark)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright with Chromium
        run: |
          mkdir -p /tmp/shots-tool && cd /tmp/shots-tool && npm init -y > /dev/null && npm i -s playwright@1.50.1
          npx -y playwright@1.50.1 install --with-deps chromium
      - name: The live page, after the new version is served
        env:
          URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          want=$(sh site/build.sh > /dev/null && md5sum site/_site/index.html | cut -c1-32)
          for i in $(seq 1 30); do
            got=$(curl -fsSL "${URL}index.html?v=$GITHUB_SHA" | md5sum | cut -c1-32 || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          echo "live page: $URL (matches this commit: $([ "$got" = "$want" ] && echo yes || echo 'not yet'))" >> "$GITHUB_STEP_SUMMARY"
          cp site/tools/screens.mjs /tmp/shots-tool/
          node /tmp/shots-tool/screens.mjs "${URL}index.html" "$GITHUB_WORKSPACE/shots/live"
      - uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: shots/live/*.png

  decide:
    name: Big change? (the Taste gate runs only for big changes)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.d.outputs.gate }}
      why: ${{ steps.d.outputs.why }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          RUN_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gate || 'false' }}
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          sh tools/ci/gate_decide.sh "${{ github.event.before }}" "$GITHUB_SHA" "site docs/launch" "site/assets/site.css" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  taste:
    name: Taste gate (information only, big changes only; never blocks the deploy)
    needs: decide
    if: needs.decide.outputs.gate == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools (WebP encoder, Playwright with Chromium)
        run: |
          sudo apt-get install -y -qq webp > /dev/null
          mkdir -p /tmp/shots-tool && cd /tmp/shots-tool && npm init -y > /dev/null && npm i -s playwright@1.50.1
          npx -y playwright@1.50.1 install --with-deps chromium
      - name: Taste skill at the pinned commit (MIT)
        run: git clone -q https://github.com/Leonxlnx/taste-skill.git /tmp/taste && git -C /tmp/taste checkout -q "$TASTE_COMMIT"
      - name: Build the page
        run: sh site/build.sh
      - name: Screenshots, 1440, 1024, 768 and 390 px, light and dark
        run: |
          (cd site/_site && python3 -m http.server 8098 > /dev/null 2>&1 &)
          sleep 2
          cp site/tools/screens.mjs /tmp/shots-tool/
          node /tmp/shots-tool/screens.mjs http://localhost:8098/index.html "$GITHUB_WORKSPACE/shots/site"
      - name: Keep the screenshots at once (before the slower checks)
        uses: actions/upload-artifact@v4
        with:
          name: site-shots
          path: shots/site/*.png
      - name: Taste finish gate (information only, the findings go to the job summary)
        run: |
          # Ubuntu 24.04 runners restrict user namespaces, which Chrome's sandbox needs (Taste starts its own Chrome)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null
          export CHROME_PATH=$(cd /tmp/shots-tool && node -e "console.log(require('playwright').chromium.executablePath())")
          S=/tmp/taste/skills/taste-skill/scripts
          R="$GITHUB_WORKSPACE/shots/site/taste"
          mkdir -p "$R"
          cd site/_site
          mkdir -p .taste-skill
          if [ -f ../.taste-skill/waivers.json ]; then cp ../.taste-skill/waivers.json .taste-skill/; fi
          node "$S/copy-lint.mjs" index.html --kind software | tee "$R/copy-lint.txt" || true
          node "$S/gate.mjs" --start index.html --kind software --category "$CATEGORY" --primary "$PRIMARY" || true
          node "$S/gate.mjs" index.html 2>&1 | tee "$R/gate.txt" || true
          cp -r .taste-skill/gate "$R/" 2>/dev/null || true
          { echo '### Taste gate, landing page'; echo '```'; tail -60 "$R/gate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "Taste gate ran because: ${{ needs.decide.outputs.why }}. Information only; the page is deployed already." >> "$GITHUB_STEP_SUMMARY"
      - name: Taste checker at every width, layout check and speed (reports only)
        if: always()
        run: |
          export CHROME_PATH=$(cd /tmp/shots-tool && node -e "console.log(require('playwright').chromium.executablePath())")
          T=/tmp/taste/skills/taste-skill
          R="$GITHUB_WORKSPACE/shots/site/taste"
          mkdir -p "$R/full" "$R/layout"
          cd site/_site
          timeout 900 node "$T/scripts/consistency.mjs" index.html --widths 1440,1024,820,768,390 --rhythm-widths 1440,820,768,390 \
            --profile /tmp/taste-full --page software --category "$CATEGORY" --primary "$PRIMARY" --out "$R/full" > "$R/consistency.txt" 2>&1 || true
          timeout 600 node "$T/assets/layout/check.mjs" --url index.html --profile /tmp/taste-layout \
            --sizes 1440x900,1024x768,820x1180,768x1024,390x844 --shots "$R/layout" > "$R/layout.txt" 2>&1 || true
          timeout 300 node "$T/scripts/perf.mjs" index.html --profile /tmp/taste-perf > "$R/perf.txt" 2>&1 || true
          grep -E '^\s*(FAIL|WARN)' "$R/consistency.txt" | sort | uniq -c | sort -rn | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screens
          path: shots/site/
