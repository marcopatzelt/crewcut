name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  media-debian:
    name: Cut and render tests on the image's ffmpeg (Debian bookworm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg python3 python3-venv > /dev/null
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install -q -e ".[dev]"
      - run: ffmpeg -version | head -1
      - run: /tmp/v/bin/pytest -q tests/cut tests/render
      - name: On failure, show what ebur128 and the limiter do with a test signal
        if: failure()
        run: |
          cd /tmp
          ffmpeg -v error -y -f lavfi -i "aevalsrc=0.4*sin(2*PI*330*t)*between(mod(t\,1)\,0.2\,0.7):s=48000:d=3" -c:a pcm_s24le t.wav
          ffmpeg -hide_banner -nostats -i t.wav -af ebur128=peak=true:framelog=verbose -f null - 2>&1 | tail -14
          ffmpeg -v error -y -i t.wav -af "volume=-6dB,alimiter=limit=0.79:attack=5:release=50:level=false" -c:a pcm_s24le l.wav
          ffmpeg -hide_banner -nostats -i l.wav -af ebur128=peak=true:framelog=verbose -f null - 2>&1 | tail -14

  web:
    name: Web UI checks, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run check
      - name: Brand files are built from Slate's one source (tools/brand/build.mjs --check)
        run: node --experimental-strip-types ../tools/brand/build.mjs --check
      - run: npm test
      - run: npm run build
      - name: The build ships no sample or demo data (only the CI pictures use tests/web-sample)
        run: |
          test ! -e dist/demo && test ! -e dist/sample
          if grep -rIlE "sample/media|website-100-times|Demo data|sample-token|__crewcutPlayDone|[?&]demo=" dist; then
            echo "sample or demo content in dist/"; exit 1
          fi

  scripts:
    name: Shell and JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n start.sh && bash -n docker/entrypoint.sh && bash -n host/crewcut-host.sh && bash -n host/open-app.sh && sh -n install.sh
      - name: shellcheck of the host scripts (they run on the user's computer)
        run: shellcheck -S warning host/crewcut-host.sh host/open-app.sh start.sh install.sh
      - run: node --check tools/ci/sample_server.mjs && node --check tools/ci/readme_shots.mjs
      - run: for f in tools/*.js templates/2d/*.js; do if [ -f "$f" ]; then node --check "$f"; fi; done

  diagrams:
    name: Mermaid diagrams parse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every mermaid block of the README and the docs
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null
          python3 tools/ci/extract_mermaid.py /tmp/mmd README.md docs/*.md
          for f in /tmp/mmd/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.4.0 -q -i "$f" -o "${f%.mmd}.svg"
          done
          ls -la /tmp/mmd

  privacy:
    name: Secrets and personal data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v
      - name: no personal paths or numbers
        run: |
          if grep -rnI -e "/home/pol[o]" -e "marcopatzelt8[2]" -e "+4[9]" --exclude-dir=.git . ; then
            echo "Personal data found (see above)."; exit 1
          fi
