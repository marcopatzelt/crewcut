name: desktop

# Builds the desktop app (desktop/, Electron) on GitHub's runners, never on a laptop: a dmg and a zip for Apple silicon
# and Intel Macs, an NSIS installer for Windows, an AppImage and a .deb for Linux. The files are workflow artifacts
# only; nothing is published and no release is made here (the owner makes releases).
# Signing switches itself on when the secrets exist (desktop/electron-builder.config.cjs): CSC_LINK and
# CSC_KEY_PASSWORD (a Developer ID or a Windows certificate), and for notarizing either APPLE_API_KEY (the .p8 text),
# APPLE_API_KEY_ID and APPLE_API_ISSUER, or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID. Without them the
# Mac app is ad-hoc signed (Apple silicon needs at least that) and the Windows installer is unsigned.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", "compose.yaml", "web/src/styles/tokens.css", "docs/brand/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: node --check ui/onboarding.js

  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: --mac dmg zip --arm64 --x64
          - name: Windows
            os: windows-latest
            targets: --win nsis --x64
          - name: Linux
            os: ubuntu-24.04
            targets: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - name: Inter for the app's own pages (from the web app's packages)
        run: cd web && npm ci --no-audit --no-fund --ignore-scripts
      - run: cd desktop && npm ci --no-audit --no-fund
      - name: Version (a v* tag is a release; everything else a development build that follows the :edge image)
        id: version
        run: |
          base=$(node -p "require('./desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$base-dev.$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Desktop app $v"
      - run: cd desktop && npm run build
      - name: Signing (on only when the secrets exist; electron-builder.config.cjs reads them)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only the secrets that exist reach the packaging step: an empty CSC_LINK would read as a path.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value=$(printenv "$name" || true)
            if [ -n "$value" ]; then
              { echo "$name<<CREWCUT_EOF"; echo "$value"; echo "CREWCUT_EOF"; } >> "$GITHUB_ENV"
            fi
          done
          signed=false
          if [ -n "$CSC_LINK" ]; then
            signed=true
            if [ -n "$APPLE_API_KEY_TEXT" ]; then
              printf '%s' "$APPLE_API_KEY_TEXT" > "$RUNNER_TEMP/apple-api-key.p8"
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ "$signed" = true ]; then echo '{"signed": true}'; else echo '{"signed": false}'; fi \
            > desktop/dist/build-info.json
          echo "Signed: $signed (without it: ad-hoc on the Mac, unsigned on Windows)"
      - name: Package
        working-directory: desktop
        run: >
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.targets }} --publish never
          -c.extraMetadata.version=${{ steps.version.outputs.version }}
      - name: The Mac app's signature
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          for app in release/mac*/Crewcut.app; do
            echo "== $app"; codesign -dv --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Format|Signature|TeamIdentifier|Runtime)" || true
            codesign --verify --deep --strict "$app" && echo "signature verifies"
          done
      - name: Pictures of the app's first screens
        continue-on-error: true
        working-directory: desktop
        env:
          CREWCUT_DESKTOP_SHOTS: ${{ github.workspace }}/shots/${{ matrix.name }}
          CREWCUT_NO_UPDATES: "1"
        run: |
          mkdir -p "$CREWCUT_DESKTOP_SHOTS"
          # The app takes pictures of its own pages, then quits by itself (after two minutes it is stopped). When its
          # last page is up, a picture of the whole screen shows the real window, with the system's window buttons.
          screen() { :; }
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y -qq xvfb x11-apps imagemagick > /dev/null
              Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
              export DISPLAY=:99
              sleep 2
              screen() { xwd -root -silent -display :99 | convert xwd:- "$CREWCUT_DESKTOP_SHOTS/screen.png"; }
              set -- release/linux-unpacked/crewcut --no-sandbox --disable-gpu ;;
            macOS)
              dir=release/mac-arm64; [ "$(uname -m)" = x86_64 ] && dir=release/mac
              screen() { screencapture -x "$CREWCUT_DESKTOP_SHOTS/screen.png"; }
              set -- "$dir/Crewcut.app/Contents/MacOS/Crewcut" ;;
            Windows)
              set -- release/win-unpacked/Crewcut.exe ;;
          esac
          "$@" & pid=$!
          for _ in $(seq 1 120); do
            if [ -f "$CREWCUT_DESKTOP_SHOTS/settings.png" ]; then sleep 1; screen || true; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          ls -la "$CREWCUT_DESKTOP_SHOTS"
      - uses: actions/upload-artifact@v4
        with:
          name: crewcut-desktop-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.yml
            desktop/release/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crewcut-desktop-pictures-${{ matrix.name }}
          path: shots/
          if-no-files-found: ignore
