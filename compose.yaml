# Crewcut: `docker compose up` (or ./start.sh, which also writes .env on the first run).
# The web UI is only reachable from this computer (127.0.0.1). The teleprompter port is open to your network so a
# phone can read the script; every teleprompter link carries a random token.
name: crewcut
services:
  crewcut:
    image: ghcr.io/marcopatzelt/crewcut:${CREWCUT_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    pull_policy: ${CREWCUT_PULL_POLICY:-missing}
    env_file:
      - path: .env
        required: false
    environment:
      CREWCUT_STUDIO: /studio
    ports:
      - "127.0.0.1:${CREWCUT_PORT:-4747}:4747"
      - "${CREWCUT_PROMPTER_BIND:-0.0.0.0}:${CREWCUT_PROMPTER_PORT:-4748}:4748"
    volumes:
      - ${CREWCUT_STUDIO_DIR:-./studio}:/studio
      - ${CREWCUT_IMPORT_DIR:-./import}:/import:ro   # optional: earlier work to import, read only
      - engine:/opt/engine
      # optional: copy your own Claude Code settings (skills, agents, CLAUDE.md, settings.json) in once, read only
      # - ~/.claude:/host-claude:ro
    shm_size: "1gb"            # Chromium renders the 2D graphics; Docker's default 64 MB is too small for big frames
    restart: unless-stopped

volumes:
  engine:
