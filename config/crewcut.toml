# Crewcut settings. Copy a key into <studio>/config/crewcut.toml to change it for your studio.
# The agents pick sensible values themselves; nothing here has to be touched to start.

[engine]
name = "claude"            # claude (Claude Code, default) or codex (beta); the user can also just say "use Codex"
max_parallel_agents = 5    # independent agent runs; heavy renders still use their separate single-job lane
agent_timeout_minutes = 60
update_every_hours = 24    # look for a newer engine version this often, only while no job runs

[engine.claude]
channel = "latest"         # latest (default), stable, or a fixed version such as "2.1.325"; a version that fails the
                           # smoke test is never used, two engine failures in a row go back to the last good one
crew = "runs"              # runs: every crew member is its own Claude Code run (`--agent crewcut:<id>`)
                           # subagents: the Showrunner runs and hands work to the crew as its subagents
plugin = true              # load Crewcut as a Claude Code plugin (skills, crew agents, guard hook)
plan_model = ""            # empty = the model Claude Code picks for your plan; any name Claude Code knows works
work_model = ""
probe_model = ""           # the model of the tiny login test at start; empty = Claude Code's default
extra_args = []            # passed to every run, unchanged, e.g. ["--fallback-model", "sonnet"]
env = {}                   # extra environment for every run

[engine.codex]
channel = "latest"
plan_model = ""            # empty = the model Codex picks for your plan
work_model = ""
extra_args = []
config = []                # -c key=value pairs passed to every run, e.g. ['model_verbosity="low"']
env = {}

[crew.talk]
enabled = false            # crew members message each other directly (fix, question, notice); off until measured
max_rounds = 2             # rounds (message and answer) per topic, then the Showrunner decides
max_fix_rounds = 3         # fix rounds between the Critic and the builder per piece of work
max_per_episode = 20       # crew messages per episode

[steps]
# Optional steps of a new episode (older episodes skip them when they get there). Proof is a separate fact check with
# its own card. Off: the Writer gathers the facts, numbers, clips and scenes that serve the story while preparing the
# script, with no card and no report, and the Critic quietly checks the finished script for false or misleading claims.
proof = false
# The interview opens the script step of a long video: after the title is approved and before the first draft, the
# Writer asks you 5 to 8 open questions in the episode chat (your start, doubts, the real turning point, setbacks, how
# you work). Your answers, typed or spoken, go into brief/INTERVIEW-vNNN.md and the script uses your own sentences.
# Off: the Writer drafts from the brief and the research alone. "Skip interview" skips it for one episode.
interview = true

[queue]
heavy_parallel = 1        # heavy jobs (render, transcription, assembly) at the same time

[render]
location = "local"         # where motion graphics render: "local" (this computer, needs effectcraft-cli; the image has
                           # it) or "rented" (one rented machine after a spend card: $2 a video, $0.50 a Short at most).
                           # `crewcut render motion --local / --rented` wins for one run. See docs/motion.md.

[humanizer]
# Every script draft goes through Humanizer (blader/humanizer, MIT) before its card, in the "Embedded" mode with your
# own spoken words from brand/voice/ as the sample. Say "no humanizer" to switch it off.
enabled = true

# Skills from other projects: downloaded at start, newest release (channel "latest") or a fixed tag; never copied into
# this repository. `steps` says where the crew uses them (Codex gets the text in the prompt for these steps).
[[skills.external]]
name = "humanizer"
repo = "blader/humanizer"
channel = "latest"
license = "MIT"
steps = ["script", "title", "upload"]

# Your own skills (docs/own-skills.md): folders <studio>/skills/<name>/SKILL.md, named in <studio>/config/crewcut.toml
# [[skills.own]]
# name = "my-titles"
# steps = ["title"]          # "*" = every step and the channel conversation
# roles = ["scout"]          # optional, default: whoever works on those steps
# replaces = ["title"]       # optional: the Crewcut skills it overrides on content, voice and style

[youtube]
chrome_setup = true        # "Connect YouTube" lets Claude in Chrome set up the API once; uploads always use the API

[money]
cap_month_usd = 20.0       # real money per month (rented GPUs, paid APIs); renting stops at the cap
default_episode_budget_usd = 5.0

[server]
port = 4747
prompter_port = 4748
