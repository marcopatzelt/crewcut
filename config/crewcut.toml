# Crewcut settings. Copy a key into <studio>/config/crewcut.toml to change it for your studio.
# The agents pick sensible values themselves; nothing here has to be touched to start.

[engine]
name = "claude"            # claude (Claude Code, default) or codex (beta); the user can also just say "use Codex"
max_parallel_agents = 3    # agent runs at the same time
agent_timeout_minutes = 60
update_every_hours = 24    # look for a newer engine version this often, only while no job runs

[engine.claude]
channel = "latest"         # latest (default), stable, or a fixed version such as "2.1.325"; a version that fails the
                           # smoke test is never used, two engine failures in a row go back to the last good one
crew = "runs"              # runs: every crew member is its own Claude Code run (`--agent crewcut:<id>`)
                           # subagents: the Showrunner runs and hands work to the crew as its subagents
plugin = true              # load Crewcut as a Claude Code plugin (skills, crew agents, guard hook)
plan_model = ""            # empty = the model Claude Code picks for your plan; any name Claude Code knows works
work_model = ""
probe_model = ""           # the model of the tiny login test at start; empty = Claude Code's default
extra_args = []            # passed to every run, unchanged, e.g. ["--fallback-model", "sonnet"]
env = {}                   # extra environment for every run

[engine.codex]
channel = "latest"
plan_model = ""            # empty = the model Codex picks for your plan
work_model = ""
extra_args = []
config = []                # -c key=value pairs passed to every run, e.g. ['model_verbosity="low"']
env = {}

[crew.talk]
enabled = false            # crew members message each other directly (fix, question, notice); off until measured
max_rounds = 2             # rounds (message and answer) per topic, then the Showrunner decides
max_fix_rounds = 3         # fix rounds between the Critic and the builder per piece of work
max_per_episode = 20       # crew messages per episode

[queue]
heavy_parallel = 1         # heavy jobs (render, transcription, assembly) at the same time

[money]
cap_month_usd = 20.0       # real money per month (rented GPUs, paid APIs); renting stops at the cap
default_episode_budget_usd = 5.0

[server]
port = 4747
prompter_port = 4748
